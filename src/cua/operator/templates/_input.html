{# one input field; expects prefix, name, label, spec #}
<div style="display:flex; gap:12px; align-items:center; margin:6px 0; flex-wrap:wrap">
  <label for="{{ prefix }}{{ name }}" style="min-width:220px">{{ label }}{% if spec.sensitivity.value == "pii" %} <span class="small soft">(personal data)</span>{% endif %}</label>
  {% if spec.enum %}
    <select id="{{ prefix }}{{ name }}" name="{{ prefix }}{{ name }}">{% for option in spec.enum %}<option>{{ option }}</option>{% endfor %}</select>
  {% elif spec.type.value == "money" %}
    <span>$ <input type="text" id="{{ prefix }}{{ name }}" name="{{ prefix }}{{ name }}" inputmode="decimal" pattern="^\d+(\.\d{1,2})?$" placeholder="0.00" size="12"></span>
  {% else %}
    <input type="text" id="{{ prefix }}{{ name }}" name="{{ prefix }}{{ name }}" {% if spec.pattern %}pattern="{{ spec.pattern | replace('^', '') | replace('$', '') }}"{% endif %} size="20">
  {% endif %}
</div>
