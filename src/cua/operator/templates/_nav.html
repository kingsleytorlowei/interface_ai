<header class="topbar"><div class="topbar-inner">
  <a class="wordmark" href="/">Operator <span>workbench</span></a>
  <nav>
    <a href="/" class="{{ 'active' if active == 'home' }}">Home</a>
    <a href="/new" class="{{ 'active' if active == 'new' }}">New automation</a>
    <a href="/jobs" class="{{ 'active' if active == 'jobs' }}">Activity</a>
    <a href="/needs-you" class="{{ 'active' if active == 'needs-you' }}">Needs you{% if pending %}<span class="count">{{ pending }}</span>{% endif %}</a>
  </nav>
  {% if current_job %}<a class="busy" href="/jobs/{{ current_job.id }}" title="{{ current_job.title }}">Running: {{ current_job.title }}</a>{% endif %}
  <form class="who" method="post" action="/operator">
    <label for="opname">You are</label>
    <input type="text" id="opname" name="name" value="{{ operator }}" placeholder="your name" autocomplete="name">
    <button class="quiet">Save</button>
  </form>
</div></header>
<script>if ({{ operator | tojson }}) localStorage.setItem('operator', {{ operator | tojson }});</script>
