<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Operator workbench{% endblock %}</title>
<link rel="stylesheet" href="/static/workbench.css">
{% block head %}{% endblock %}</head>
<body>
{% include "_nav.html" %}
<main>
{% if message %}<div class="note">{{ message }}</div>{% endif %}
{% if error %}<div class="note error">{{ error }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body></html>
